[project]
name = "labs"
version = "0.1.0"
description = "Консольный калькулятор арифметических выражений и конвертер единиц измерения"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.4.2",
]
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["toolkit*"]
